<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1200" />
  <title>OG Image Template — Hyper Grid Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
    }

    body {
      background: #080f14;
      color: #f0f4f8;
      font-family: 'DM Sans', sans-serif;
      position: relative;
    }

    /* Borde izquierdo de acento verde */
    body::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 5px;
      background: linear-gradient(to bottom, #10b981, rgba(16, 185, 129, 0.2));
    }

    /* Brillo verde en esquina superior derecha */
    .glow-1 {
      position: absolute;
      top: -120px;
      right: -80px;
      width: 480px;
      height: 480px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.18) 0%, transparent 70%);
      pointer-events: none;
    }

    /* Brillo azul sutil en esquina inferior izquierda */
    .glow-2 {
      position: absolute;
      bottom: -100px;
      left: 60px;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.1) 0%, transparent 70%);
      pointer-events: none;
    }

    /* Cuadricula de fondo sutil */
    .grid-bg {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse at 60% 40%, black 20%, transparent 75%);
      -webkit-mask-image: radial-gradient(ellipse at 60% 40%, black 20%, transparent 75%);
    }

    /* Contenedor principal con padding */
    .wrapper {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      padding: 64px 72px 56px 80px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Sección superior: logo + badge */
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-family: 'Syne', sans-serif;
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: #f0f4f8;
    }

    .logo span {
      color: #10b981;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.75rem;
      font-weight: 500;
      color: #10b981;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.25);
      padding: 6px 16px;
      border-radius: 999px;
    }

    .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
      flex-shrink: 0;
    }

    /* Bloque central: titulos */
    .center {
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 820px;
    }

    .tag {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #10b981;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.2);
      padding: 4px 12px;
      border-radius: 999px;
      width: fit-content;
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-size: 3.4rem;
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.04em;
      color: #f0f4f8;
    }

    h1 em {
      font-style: normal;
      color: #10b981;
    }

    .subtitle {
      font-size: 1.15rem;
      color: #6b8094;
      font-weight: 400;
      letter-spacing: 0.01em;
    }

    /* Fila de servicios como chips */
    .chips {
      display: flex;
      gap: 10px;
      margin-top: 4px;
    }

    .chip {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.09);
      color: #9ab0c2;
      font-size: 0.8rem;
      font-weight: 500;
      padding: 5px 14px;
      border-radius: 999px;
    }

    /* Sección inferior: url + línea de stats */
    .bottom {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
    }

    .url {
      font-family: 'Syne', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      color: #10b981;
      letter-spacing: 0.02em;
    }

    .stats {
      display: flex;
      gap: 36px;
    }

    .stat {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
    }

    .stat-num {
      font-family: 'Syne', sans-serif;
      font-size: 1.3rem;
      font-weight: 800;
      color: #f0f4f8;
    }

    .stat-label {
      font-size: 0.68rem;
      color: #6b8094;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .stat-divider {
      width: 1px;
      height: 36px;
      background: rgba(255, 255, 255, 0.07);
      align-self: center;
    }
  </style>
</head>
<body>

  <!-- Elementos decorativos de fondo -->
  <div class="grid-bg"></div>
  <div class="glow-1"></div>
  <div class="glow-2"></div>

  <div class="wrapper">
    <!-- Fila superior: logo y badge -->
    <div class="top">
      <div class="logo">Hyper<span>Grid</span>.Studio</div>
      <div class="badge">
        <span class="badge-dot"></span>
        Disponible para nuevos proyectos
      </div>
    </div>

    <!-- Contenido central -->
    <div class="center">
      <span class="tag">Desarrollo Web Profesional</span>
      <h1>Soluciones Web Modernas<br />y de <em>Alto Rendimiento</em></h1>
      <p class="subtitle">Diseño Web · E-Commerce · Proyectos Personalizados</p>
      <div class="chips">
        <span class="chip">React &amp; Next.js</span>
        <span class="chip">Tailwind CSS</span>
        <span class="chip">Vercel</span>
        <span class="chip">SEO Optimizado</span>
      </div>
    </div>

    <!-- Fila inferior: URL + estadísticas -->
    <div class="bottom">
      <div class="url">hypergrid.studio</div>
      <div class="stats">
        <div class="stat">
          <span class="stat-num">48+</span>
          <span class="stat-label">Proyectos</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat">
          <span class="stat-num">100%</span>
          <span class="stat-label">Satisfacción</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat">
          <span class="stat-num">5★</span>
          <span class="stat-label">Calificación</span>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
<!--
  INSTRUCCIONES PARA GENERAR LA IMAGEN FINAL
  ============================================
  1. Abrí este archivo en Chrome (File > Open o arrastralo al navegador).
  2. Abrí las DevTools: Ctrl+Shift+I (Windows/Linux) o Cmd+Option+I (Mac).
  3. Hacé clic en el ícono de tres puntos verticales (⋮) dentro de DevTools.
  4. Seleccioná "Run command" (o presioná Ctrl+Shift+P).
  5. Escribí "screenshot" y elegí "Capture full size screenshot".
  6. Chrome descargará el PNG automáticamente.
  7. Renombrá el archivo a "og-preview.png" y movelo a /img/.
  ============================================
-->
